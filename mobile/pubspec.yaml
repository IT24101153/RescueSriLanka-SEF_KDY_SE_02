name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  http: ^1.6.0
  http_parser: ^4.1.2
  geolocator: ^14.0.2
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

dependency_overrides:
  # geolocator_linux pins package_info_plus ^9.0.0, but 9.0.1's Android
  # build script unconditionally applies the Kotlin Gradle Plugin, which
  # breaks compilation under AGP 9's built-in Kotlin support. 10.x skips
  # that on AGP >= 9.
  package_info_plus: ^10.2.1
